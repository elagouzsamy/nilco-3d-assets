<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجسمات GLB - NilCo</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>body{font-family:"Segoe UI",sans-serif;background:#f6f7f9;margin:0;padding:16px}h2{margin:24px 0 8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.c{background:#fff;border-radius:14px;padding:10px;text-align:center}model-viewer{width:100%;height:180px;background:#f1eeda;border-radius:10px}.n{font-weight:600;margin-top:6px}.f{font-size:12px;color:#666;direction:ltr}</style></head><body>
<h1>مجسمات 3D (GLB) تتلف بالصباع</h1><p>حرّك المجسم بصباعك أو بالماوس. الرخص في <a href="models/LICENSES.md">models/LICENSES.md</a>.</p><div id="out"></div>
<script>fetch('models.json').then(r=>r.json()).then(m=>{const T={agents:'وكلاء الذكاء الاصطناعي',office:'مكتب',city:'مباني تجارية وأبراج',buildings:'أجزاء مباني',furniture:'عفش ومكاتب','food-kenney':'أكل (Kenney)',food:'أكل',shop:'محل',products:'منتجات'};document.getElementById('out').innerHTML=Object.entries(m).map(([k,L])=>`<h2>${T[k]||k}</h2><div class="g">${L.map(x=>`<div class="c"><model-viewer src="${x.file}" camera-controls auto-rotate autoplay ${x.file.includes('robot')?'animation-name="Wave"':''} loading="lazy" shadow-intensity="1" alt="${x.ar}"></model-viewer><div class="n">${x.ar}</div><div class="f">${x.file}</div></div>`).join('')}</div>`).join('')})</script>
</body></html>
